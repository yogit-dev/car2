<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YMGENV Drive 3D</title><link rel="stylesheet" href="./style.css"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script></head><body><main id="lobby"><header>YMGENV <b>DRIVE 3D</b><small>8-PLAYER ONLINE DRIVING</small></header><section class="panel" id="home"><h1>Hit the road.</h1><p>Drive together in one shared 3D world.</p><button id="create" class="primary">Create room</button><p class="or">OR JOIN A FRIEND</p><input id="code" maxlength="6" placeholder="ROOM CODE"><button id="join">Join room</button><p id="status">Create a room or enter a code.</p></section><section class="panel hidden" id="room"><h2>ROOM <b id="roomcode"></b></h2><p>Share this code with up to 7 friends.</p><div id="roster"></div><label>Your vehicle</label><select id="vehicle"><option value="car">Sport car</option><option value="bike">Motorbike</option><option value="bus">Bus</option></select><button id="ready" class="primary">I'm ready</button><p id="readyinfo"></p><button id="leave">Leave room</button></section></main><section id="game" class="hidden"><canvas id="view"></canvas><div class="hud">YMGENV <b>DRIVE 3D</b><span id="roomlabel"></span><strong id="speed">0 KM/H</strong><button id="exit">✕</button></div><div id="players"></div><div id="touch"><div><button data-key="left">◀</button><button data-key="right">▶</button></div><div><button data-key="brake">BRAKE</button><button data-key="gas">GAS</button></div></div><footer>WASD / Arrow keys · Touch controls on mobile · ESC to leave</footer></section><script type="module" src="./main.js"></script></body></html>
